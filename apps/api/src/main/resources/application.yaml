database:
  jdbcUrl: ${DATABASE_URL:postgresql://127.0.0.1:5432/cookbook}
  username: ${DATABASE_USER:cookbook}
  password: ${DATABASE_PASSWORD:cookbook}
  maximumPoolSize: ${DATABASE_MAX_POOL_SIZE:10}
  autoMigrate: ${AUTO_MIGRATE:true}

workos:
  apiKey: ${WORKOS_API_KEY:}
  clientId: ${WORKOS_CLIENT_ID:}
  cookiePassword: ${WORKOS_COOKIE_PASSWORD:}
  cookieSecure: ${WORKOS_COOKIE_SECURE:false}

ktor:
  deployment:
    port: 8080
    host: 0.0.0.0
  development: ${KTOR_DEVELOPMENT:false}
  application:
    modules:
      - com.bieniucieniu.cookbook.app.KoinKt.configureKoin
      - com.bieniucieniu.cookbook.core.http.SerializationKt.configureSerialization
      - com.bieniucieniu.cookbook.core.openapi.OpenApiKt.configureOpenApi
      - com.bieniucieniu.cookbook.core.database.DatabaseKt.configureDatabase
      - com.bieniucieniu.cookbook.core.health.HealthKt.configureHealth
      - com.bieniucieniu.cookbook.app.RoutingKt.configureRouting
