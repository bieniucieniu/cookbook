openapi: 3.0.3
info:
  title: Cookbook API
  version: 1.0.0
servers:
  - url: /
paths:
  /:
    get:
      operationId: getRoot
      tags: [meta]
      responses:
        "200":
          description: Greeting
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      responses:
        "200":
          description: Liveness
          content:
            text/plain:
              schema:
                type: string
  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      responses:
        "200":
          description: Recipe list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
components:
  schemas:
    Recipe:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
