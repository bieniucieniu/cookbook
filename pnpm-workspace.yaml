packages:
  - "apps/*"
  - "packages/*"

catalogMode: strict

catalog:
  "@kobalte/core": ^0.13.14
  "@xyflow/system": 0.0.83
  "@modelcontextprotocol/sdk": ^1.32.2
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/router-plugin": ^1.168.48
  "@tanstack/solid-query": ^5.105.1
  "@tanstack/solid-router": ^1.170.43
  "@tanstack/solid-router-devtools": ^1.167.2
  "@types/node": ^24.19.2
  clsx: ^2.1.1
  solid-js: ^1.9.18
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  orval: ^8.46.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plugin-solid: ^2.11.15
  vite-plus: 1.4.0
  zod: ^4.6.7

allowBuilds:
  esbuild: true
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.1"
  - "@tanstack/solid-query@5.105.1"
